name: Generate Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate snake
    uses: Platane/snk@v3
    with:
      github_user_name: simran-nitj
      outputs: |
             dist/github-contribution-grid-snake-dark.svg?color_snake=#8b5cf6&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

  - name: Push to output branch
    uses: crazy-max/ghaction-github-pages@v4
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
